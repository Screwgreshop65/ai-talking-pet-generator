[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-talking-pet-generator"
version = "1.4.0"
description = "Modular Windows desktop toolkit for generating AI-driven talking pets and talking objects."
readme = "CONTRIBUTING.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ai-talking-pet-generator contributors" }]
keywords = ["ai", "talking-pet", "desktop", "tts", "llm", "avatar"]

dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "rich>=13.7",
  "sounddevice>=0.4.6",
  "numpy>=1.26",
  "watchdog>=4.0",
]

[project.optional-dependencies]
local-llm = ["llama-cpp-python>=0.2.79"]
piper = ["piper-tts>=1.2.0"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
petgen = "petgen.bootstrap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["petgen"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["petgen/bootstrap/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"